<div class="new-event-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Criar Novo Evento</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="eventForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Nome do Evento</mat-label>
          <input matInput formControlName="nome" placeholder="Digite o nome do evento">
          <mat-error *ngIf="eventForm.get('nome')?.hasError('required')">Nome é obrigatório</mat-error>
          <mat-error *ngIf="eventForm.get('nome')?.hasError('minlength')">Nome deve ter pelo menos 3 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Local</mat-label>
          <input matInput formControlName="local" placeholder="Local do evento">
          <mat-error *ngIf="eventForm.get('local')?.hasError('required')">Local é obrigatório</mat-error>
          <mat-error *ngIf="eventForm.get('local')?.hasError('minlength')">Local deve ter pelo menos 3 caracteres</mat-error>
        </mat-form-field>

        <div class="date-time-row">
          <mat-form-field appearance="outline">
            <mat-label>Início</mat-label>
            <input matInput type="datetime-local" formControlName="inicio" placeholder="Data e hora de início" title="Data e hora de início">
            <mat-error *ngIf="eventForm.get('inicio')?.hasError('required')">Data/hora de início é obrigatória</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Fim</mat-label>
            <input matInput type="datetime-local" formControlName="fim" placeholder="Data e hora de fim" title="Data e hora de fim">
            <mat-error *ngIf="eventForm.get('fim')?.hasError('required')">Data/hora de fim é obrigatória</mat-error>
          </mat-form-field>
        </div>

        <div class="date-range-error" *ngIf="eventForm.hasError('invalidDateRange') && (eventForm.get('fim')?.touched || eventForm.get('inicio')?.touched)">
          A data/hora de fim deve ser maior que a data/hora de início.
        </div>

        <div class="form-actions">
          <button mat-button type="button" (click)="onCancel()">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="eventForm.invalid">Criar Evento</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
